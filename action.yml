name: 'Autonomous AI Issue Triager'
description: 'An AI-powered GitHub Action that automatically triages, labels, and responds to new issues securely using Gemini.'
author: 'Your Name'

inputs:
  gemini_api_key:
    description: 'Your Google Gemini API Key'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - name: Run AI Agent
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: python ${{ github.action_path }}/src/agent.py
      shell: bash

branding:
  icon: 'cpu'
  color: 'purple'